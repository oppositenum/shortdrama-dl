name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check runtime-platform.js
          node --check ffmpeg-runner.js
          node --check electron-builder.js
          node --check scripts/verify-release-version.js

      - name: Check Python and shell syntax
        if: runner.os == 'macOS'
        run: |
          python3 -m py_compile python/hongguo_grab.py python/decrypt_mdl.py python/mp4parse.py
          bash -n python/start_avd.sh scripts/setup-python.sh

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('python/start_avd.ps1', 'scripts/setup-python.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax check failed: $path"
            }
          }

  package-macos:
    name: Package macOS universal
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      - name: Build universal app smoke package
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: npm run pack:mac:universal

  package-windows:
    name: Package Windows x64
    needs: test
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      # 定位 windows-2022 上 electron-builder 启动即挂（连版本横幅都不打，--dir 也挂）。
      # 直接读日志文件已证实是真·零输出，卡在打横幅之前。这里用轻量探针区分两种可能：
      # 若 --version / --help 都秒回，说明模块能正常加载，问题在构建流水线；
      # 若这俩也挂，说明是 electron-builder 自身在该机加载/自带二进制的问题。
      # 每个探针最多等 30s 就判定挂起，整步 1 分钟内出结论，不再空耗 15 分钟。
      - name: Probe electron-builder startup
        shell: bash
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          DEBUG: electron-builder
        run: |
          set +e
          node -v
          probe() {
            local label="$1"; shift
            echo "===== probe: $label ====="
            "$@" > probe.log 2>&1 &
            local pid=$!
            local i
            for i in $(seq 1 6); do
              sleep 5
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"; echo "[$label] finished rc=$?"; cat probe.log; return
              fi
            done
            echo "[$label] STILL HANGING after 30s"
            cat probe.log
            kill "$pid" 2>/dev/null
          }
          probe "electron-builder --version" ./node_modules/.bin/electron-builder --version
          probe "electron-builder --help" ./node_modules/.bin/electron-builder --help
