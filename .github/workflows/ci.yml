name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint JavaScript
        run: npm run lint

      # 语法检查是 lint 之外的第二道：ESLint 只看配置覆盖到的文件，
      # 这里按仓库里实际存在的 .js 逐个 node --check，新增文件不会被漏掉。
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # xargs 在任何一次 node --check 失败时返回非零，整步就挂——用 while read
          # 循环反而会被最后一次迭代的状态盖住，静默放过中间的语法错误。
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          echo "checked $(git ls-files '*.js' | wc -l) files"

      - name: Check Python and shell syntax
        if: runner.os == 'macOS'
        run: |
          # 打包白名单里的 Python 全都要过编译。以前只查三个文件，
          # api_grab.py / api_client.py / metasec_offline.py 这些同样随包分发的
          # 反而没人管——它们出语法错，用户点「开始下载」才会知道。
          python3 -m py_compile \
            python/hongguo_grab.py \
            python/api_grab.py \
            python/api_client.py \
            python/metasec_offline.py \
            python/spade_keys.py \
            python/ttnet_signer.py \
            python/decrypt_mdl.py \
            python/mp4parse.py
          bash -n python/start_avd.sh scripts/setup-python.sh

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('python/start_avd.ps1', 'scripts/setup-python.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax check failed: $path"
            }
          }

  package-macos:
    name: Package macOS universal
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      - name: Build universal app smoke package
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: npm run pack:mac:universal

  package-windows:
    name: Package Windows x64
    needs: test
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      # 关键：Windows 上【不要】用 `npm run` 包一层来跑 electron-builder。
      # electron-builder 打包时会再嵌套调用 npm（npm prefix -w、@electron/rebuild 装原生依赖），
      # 若它本身是 `npm run` 的子进程，嵌套 npm 会因继承的 stdio 句柄在 Windows 上死锁，
      # 整步静默挂死十几分钟、一行输出都不出（这就是之前 CI 一直卡住的真正原因）。
      # 直接调本地 electron-builder 二进制即可绕开；实测同一台 windows-2022 上秒级完成。
      - name: Build NSIS installer smoke package
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: |
          & ./node_modules/.bin/electron-builder.cmd --config electron-builder.js --publish never --win --x64
          if ($LASTEXITCODE -ne 0) { throw "electron-builder exited with $LASTEXITCODE" }
