name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
          node --check runtime-platform.js
          node --check ffmpeg-runner.js
          node --check electron-builder.js
          node --check scripts/verify-release-version.js

      - name: Check Python and shell syntax
        if: runner.os == 'macOS'
        run: |
          python3 -m py_compile python/hongguo_grab.py python/decrypt_mdl.py python/mp4parse.py
          bash -n python/start_avd.sh scripts/setup-python.sh

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('python/start_avd.ps1', 'scripts/setup-python.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax check failed: $path"
            }
          }

  package-macos:
    name: Package macOS universal
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      - name: Build universal app smoke package
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: npm run pack:mac:universal

  package-windows:
    name: Package Windows x64
    needs: test
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install locked dependencies
        run: npm ci

      # 已确认模块加载正常（--version/--help 秒回），挂在构建流水线里。
      # 之前 Git Bash 的 `> file` 重定向对原生 node 进程走的是 MSYS 管道而非真文件，
      # node 缓冲、被 kill 时丢失，所以看着像“零输出”。这里改用 PowerShell 的
      # Start-Process + RedirectStandardOutput/Error 写【原生文件】（同步落盘、kill 后仍在），
      # 再轮询 tail，就能看到流水线到底卡在哪一步（电子/winCodeSign 下载？签名检测？）。
      - name: Build unpacked smoke package
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          DEBUG: electron-builder
        run: |
          $eb = Join-Path $PWD 'node_modules/.bin/electron-builder.cmd'
          $ebArgs = @('--dir','--config','electron-builder.js','--publish','never','--win','--x64')
          $p = Start-Process -FilePath $eb -ArgumentList $ebArgs -NoNewWindow -PassThru `
                 -RedirectStandardOutput build.out.log -RedirectStandardError build.err.log
          for ($i = 1; $i -le 26; $i++) {
            Start-Sleep -Seconds 15
            if ($p.HasExited) { break }
            Write-Host "----- still running after $($i*15)s -----"
            if (Test-Path build.out.log) { Write-Host '[stdout tail]'; Get-Content build.out.log -Tail 6 }
            if (Test-Path build.err.log) { Write-Host '[stderr tail]'; Get-Content build.err.log -Tail 6 }
          }
          if (-not $p.HasExited) { Write-Host 'TIMED OUT, killing'; $p.Kill(); Start-Sleep 2 }
          Write-Host "===== exit code: $($p.ExitCode) ====="
          Write-Host '===== full stdout ====='
          if (Test-Path build.out.log) { Get-Content build.out.log }
          Write-Host '===== full stderr ====='
          if (Test-Path build.err.log) { Get-Content build.err.log }
          if ($p.HasExited -and $p.ExitCode -eq 0) { exit 0 } else { exit 1 }
